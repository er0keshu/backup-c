# 备份清单示例 —— 复制为 config.yaml 后按需修改。
# config.yaml 已被 .gitignore 忽略,你的真实路径不会进仓库。
#
# 结构:
#   sourceRoot - 源根目录(绝对路径)。计划任务/服务账户可能与你登录账户不同,
#                故建议显式指定,不要依赖用户主目录。缺省回退到用户主目录。
#   targetDir  - 备份目标目录,可多个(逗号分隔或 YAML 列表)。
#                优先级: 命令行 -d 参数 -> 此处 targetDir -> 默认 <exe>\dist
#   include    - 要备份的路径/模式,相对 sourceRoot(支持文件、目录、glob)
#   exclude    - 排除规则,优先级高于 include:命中即跳过;命中目录则整个子树跳过
#   interval   - 备份间隔(分钟)。实际取值优先级: 命令行 -i 参数 -> 此处 interval -> 默认 10
#
# 用法:
#   backup.exe run                     启动后每 interval 分钟备份一次(计划任务/手动启动均走这条)
#   backup.exe run -d D:\a,E:\b        本次备份到多个指定目录(逗号分隔)
#   backup.exe install                 注册 Windows 计划任务(登录时自动启动,需管理员)
#
# 写法说明:
#   - 目录:  .zcode           -> 递归带出该目录下所有文件
#   - 文件:  .gitconfig       -> 只备份该文件
#   - glob:  .ssh/**          -> 通配展开;含 / 的规则按整路径匹配,也匹配祖先目录
#   - 名字:  node_modules     -> 不含 / 的规则按任意层级的名字匹配(如 *.log、__pycache__)

sourceRoot: "C:\\Users\\<你的用户名>"

# 备份目标目录,可多个。留空/删掉则用默认 <exe>\dist;命令行 -d 可临时覆盖。
# 单行逗号分隔:
targetDir: "D:\\backup\\config"
# 也可用列表(任选一种写法):
# targetDir:
#   - "D:\\backup\\a"
#   - "E:\\backup\\b"

# 备份间隔(分钟)。不设则默认 10;命令行 -i 可临时覆盖。
interval: 10

include:
  - .zcode/v2/config.json
  - .zcode/v2/setting.json
  - .zcode/v2/provider_config.json
  - .agents

exclude:
  - .git      # 任意层级的 .git 目录(整棵子树)
  - .vscode   # 任意层级的 .vscode 目录
  - .trae     # 任意层级的 .trae 目录
# 用法示例:
# exclude:
#   - "*.log"            # 任意层级的 .log 文件
#   - node_modules       # 任意层级的该目录(整棵子树)
#   - .zcode/v2/cache/** # 指定子树
